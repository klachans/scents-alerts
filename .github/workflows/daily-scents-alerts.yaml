name: Daily Scents Alerts

on:
  schedule:
    - cron: '1 8 * * *'
  
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create personal YAML file
        run: |
          cat << 'EOF' > cfg/watchlist.yaml
          ${{ secrets.MY_WATCHLIST }}
          EOF

      - name: Run Scents Alerts
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python src/main.py
